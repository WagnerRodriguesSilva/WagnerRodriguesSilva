name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Criar pasta assets
        run: mkdir -p assets

      - name: Baixar Stats Card
        run: |
          for i in 1 2 3; do
            curl -s --retry 3 --retry-delay 5 \
              -H "User-Agent: Mozilla/5.0" \
              -o assets/stats.svg \
              "https://github-readme-stats-salesp07.vercel.app/api?username=WagnerRodriguesSilva&show_icons=true&theme=tokyonight&include_all_commits=true&count_private=true&hide_border=true&bg_color=0d1117&title_color=58a6ff&icon_color=58a6ff&text_color=8b949e"
            grep -q '<svg' assets/stats.svg && echo "Stats OK" && break
            echo "Tentativa $i falhou, aguardando..."
            sleep 15
          done

      - name: Baixar Top Languages
        run: |
          for i in 1 2 3; do
            curl -s --retry 3 --retry-delay 5 \
              -H "User-Agent: Mozilla/5.0" \
              -o assets/top-langs.svg \
              "https://github-readme-stats-salesp07.vercel.app/api/top-langs/?username=WagnerRodriguesSilva&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=58a6ff&text_color=8b949e&langs_count=6"
            grep -q '<svg' assets/top-langs.svg && echo "Top Langs OK" && break
            echo "Tentativa $i falhou, aguardando..."
            sleep 15
          done

      - name: Baixar Streak
        run: |
          for i in 1 2 3; do
            curl -s --retry 3 --retry-delay 5 \
              -H "User-Agent: Mozilla/5.0" \
              -o assets/streak.svg \
              "https://streak-stats.demolab.com/?user=WagnerRodriguesSilva&theme=tokyonight&hide_border=true&background=0d1117&ring=58a6ff&fire=58a6ff&currStreakLabel=58a6ff"
            grep -q '<svg' assets/streak.svg && echo "Streak OK" && break
            echo "Tentativa $i falhou, aguardando..."
            sleep 15
          done

      - name: Verificar arquivos baixados
        run: |
          echo "=== Verificando SVGs ==="
          for f in assets/stats.svg assets/top-langs.svg assets/streak.svg; do
            if grep -q '<svg' "$f"; then
              echo "✓ $f OK ($(wc -c < $f) bytes)"
            else
              echo "✗ $f INVÁLIDO"
              head -3 "$f"
            fi
          done

      - name: Commitar assets atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore: atualizar métricas do GitHub [skip ci]"
          git push
