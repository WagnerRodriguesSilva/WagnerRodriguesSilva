name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats Card
        uses: anuraghazra/github-readme-stats@latest
        with:
          username: WagnerRodriguesSilva
          theme: tokyonight
          show_icons: true
          include_all_commits: true
          count_private: true
          hide_border: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Stats Card
        run: |
          curl -o assets/stats.svg "https://github-readme-stats.vercel.app/api?username=WagnerRodriguesSilva&show_icons=true&theme=tokyonight&include_all_commits=true&count_private=true&hide_border=true&bg_color=0d1117&title_color=58a6ff&icon_color=58a6ff&text_color=8b949e"
          curl -o assets/top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=WagnerRodriguesSilva&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=58a6ff&text_color=8b949e&langs_count=6"
          curl -o assets/streak.svg "https://streak-stats.demolab.com/?user=WagnerRodriguesSilva&theme=tokyonight&hide_border=true&background=0d1117&ring=58a6ff&fire=58a6ff&currStreakLabel=58a6ff"
          curl -o assets/trophy.svg "https://github-profile-trophy.vercel.app/?username=WagnerRodriguesSilva&theme=tokyonight&no-frame=true&row=1&column=6&margin-w=8"

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore: atualizar métricas do GitHub [skip ci]" || echo "Nada para commitar"
          git push
