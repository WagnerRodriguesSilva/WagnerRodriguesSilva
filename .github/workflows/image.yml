name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Criar pasta assets
        run: mkdir -p assets

      - name: Baixar Stats Card
        run: |
          curl -s -o assets/stats.svg \
            "https://github-readme-stats.vercel.app/api?username=WagnerRodriguesSilva&show_icons=true&theme=tokyonight&include_all_commits=true&count_private=true&hide_border=true&bg_color=0d1117&title_color=58a6ff&icon_color=58a6ff&text_color=8b949e"

      - name: Baixar Top Languages
        run: |
          curl -s -o assets/top-langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=WagnerRodriguesSilva&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=58a6ff&text_color=8b949e&langs_count=6"

      - name: Baixar Streak
        run: |
          curl -s -o assets/streak.svg \
            "https://streak-stats.demolab.com/?user=WagnerRodriguesSilva&theme=tokyonight&hide_border=true&background=0d1117&ring=58a6ff&fire=58a6ff&currStreakLabel=58a6ff"

      - name: Baixar Trophy
        run: |
          curl -s -o assets/trophy.svg \
            "https://github-profile-trophy.vercel.app/?username=WagnerRodriguesSilva&theme=tokyonight&no-frame=true&row=1&column=6&margin-w=8"

      - name: Commitar assets atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore: atualizar métricas do GitHub [skip ci]"
          git push
